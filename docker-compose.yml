services:
  tony:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tony
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      # Mount data directory so Excel workbook, SQLite state, backups, and attachments persist
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
